{% load static %}
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Спортивные соревнования{% endblock %} | Спортивные соревнования</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'homepage/css/style.css' %}" rel="stylesheet">
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a class="brand" href="{% url 'homepage:index' %}">
          <img src="{% static 'homepage/img/logo.svg' %}" alt="Логотип спортивных соревнований" width="56" height="56">
          <span>Система управления спортивными соревнованиями</span>
        </a>
        {% include 'includes/navigation.html' %}
      </div>
    </header>
    <main class="container page-content">
      {% block content %}{% endblock %}
    </main>
    <script src="{% static 'homepage/js/main.js' %}" defer></script>
  </body>
</html>
